# push·PR마다 테스트를 돈다. 마켓플레이스에 올리기 전에 여기서 먼저 통과해야 한다.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tests (VS Code 확장 91개)
        run: npm test

  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: JS 엔진으로 대조 기준값 다시 만들기 (Java 엔진이 지금 JS 엔진과 같은지 확인)
        run: node jetbrains/tools/make-fixtures.js .
      - name: Tests (JetBrains 플러그인 21개)
        working-directory: jetbrains
        run: chmod +x gradlew && ./gradlew test buildPlugin verifyPluginStructure
